name = "personal-homepage-admin-auth"
main = "src/index.js"
compatibility_date = "2026-09-27"
workers_dev = true

[assets]
directory = "../dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# 배포한 홈페이지의 정확한 origin으로 교체합니다. 예: https://example.com
ALLOWED_ORIGIN = "https://personal-homepage-admin-auth.dejangbu83.workers.dev"

[[d1_databases]]
binding = "MESSAGES"
database_name = "personal-homepage-messages"
database_id = "97a597e7-06a0-4c93-b51a-cba16bdecb66"

[secrets]
required = ["ADMIN_USERNAME", "ADMIN_PASSWORD", "SESSION_SECRET"]
